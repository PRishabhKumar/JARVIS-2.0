[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-command-agent"
version = "0.1.0"
description = "Local-first typed computer-control CLI — engineering preview"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "jsonschema>=4.23,<5",
    "psutil>=6.1,<8",
    "keyring>=25.5,<26",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
live = ["google-genai==3.0.0"]
audio = ["sounddevice>=0.5,<0.6", "numpy>=1.26,<3"]
wake = ["onnxruntime>=1.20,<2", "numpy>=1.26,<3", "scipy>=1.13,<2", "scikit-learn>=1.5,<2", "requests>=2.32,<3", "tqdm>=4.66,<5"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.28,<1"]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<2", "hypothesis>=6.120,<7", "ruff>=0.9,<1", "httpx>=0.28,<1"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis = ["storage/migrations/*.sql", "catalog.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
