name: Contract and safe fixture tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,live,server]"
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts
      - run: python -m compileall -q src
# Not executed by the coding environment. Physical audio/privileged VM tests remain separate release gates.
